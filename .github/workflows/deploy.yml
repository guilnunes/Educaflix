name: Deploy no GitHub Pages

# Publica o admin em modo somente leitura a cada push na main.
# Também dá para rodar à mão em Actions > Deploy no GitHub Pages > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checar tipos e testes
        run: npm run check

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build estático
        run: npm run build
        env:
          # Caminho do site no Pages, ex.: /Educaflix/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
